# =============================================================================
# CVAA baseline - key-frame / dual-4090 optimized configuration
#
# Formal run:
#     conda activate simlingo
#     python run_pipeline.py
#
# The formal input is data.keyframe_file. The optimized pipeline does NOT scan
# every instance_front frame and does NOT use frame_step for benchmark sampling.
# =============================================================================

run:
  # Dataset root used to resolve the relative route paths stored in keyframes.txt.
  input: "/root/autodl-tmp/simlingo_liulei/database/simlingo_v2_2026_09_12_22_24_28/data/simlingo"

  # Kept for compatibility with the existing config validator.
  # The optimized pipeline resolves routes directly from keyframes.txt.
  recursive: true


environments:
  simlingo_conda_env: "simlingo"
  cvaa_fill_conda_env: "cvaa_fill"

  # null -> resolve from the Conda environment name.
  simlingo_python: null
  cvaa_fill_python: null

  validate_on_startup: true


paths:
  output_root: "/root/autodl-tmp/simlingo_liulei/database/simlingo_v2_2026_09_12_22_24_28/data/simlingo/cvaa_results"

  # Keep these paths consistent with your local installation.
  official_simlingo_root: "/home/kemove/models/simlingo"
  official_simlingo_checkpoint: "/home/kemove/models/simlingo/checkpoint/simlingo/simlingo/checkpoints/epoch=013.ckpt/pytorch_model.pt"
  official_simlingo_config: null

  flux_model: "/home/kemove/models/FLUX.1-Fill-dev"
  lama_model: "/home/kemove/models/LAMA/big-lama.pt"

  # null -> system temporary directory.
  # A bounded pipeline buffer prevents temporary counterfactuals from growing
  # without bound.
  temp_root: null


data:
  # Formal benchmark manifest generated by keyframe_selector_project.
  keyframe_file: "/root/autodl-tmp/simlingo_liulei/database/simlingo_v2_2026_09_12_22_24_28/data/simlingo/keyframes.txt"

  # 0 = use every route contained in the manifest.
  max_routes: 0

  # The optimized pipeline ignores these frame sampling keys, but they are kept
  # because the original cvaa.config validator still requires frame_step and
  # validates max_frames_per_route. They do NOT control formal benchmark frames.
  frame_start: null
  frame_end: null
  frame_step: 1
  max_frames_per_route: 0

  include_static_obstacles: false


matching:
  min_projected_area: 20
  min_overlap_pixels: 5
  min_score: 0.20
  temporal_bonus: 0.20

  # IMPORTANT: in the optimized matcher this is measured in RAW frame-number
  # difference, not "selected keyframe index" difference.
  temporal_max_gap: 5


mask:
  min_mask_pixels: 10
  min_object_short_side_px: 12
  min_exact_mask_pixels: 80

  adaptive_dilate_ratio: 0.35
  adaptive_dilate_min_px: 8
  adaptive_dilate_max_px: 32


inpainting:
  backend: "flux_fill"

  # big-lama.pt is TorchScript and the current wrapper already supports CUDA.
  lama_device: "cuda"

  device: "cuda"
  dtype: "bfloat16"

  # Keep the baseline generation definition unchanged.
  num_inference_steps: 28
  guidance_scale: 30.0
  max_sequence_length: 512
  seed: 42
  prompt_override: null

  local_crop_enabled: true
  crop_context_scale: 8.0
  crop_min_side_px: 192
  crop_max_side_px: 512
  crop_target_size: 512

  flux_refine_mode: "seam"
  flux_seam_width_px: 6

  # Faster than sequential CPU offload on a 24 GB 4090 while still reducing
  # peak VRAM. If your exact FLUX environment OOMs, switch these two values:
  #     cpu_offload: false
  #     sequential_cpu_offload: true
  # No code change is required.
  cpu_offload: true
  sequential_cpu_offload: false

  vae_tiling: true

  opencv_radius: 3.0
  opencv_method: "telea"


simlingo:
  device: "cuda"
  seed: 42
  save_language: false

  emulate_online_jpeg_roundtrip: false
  jpeg_quality: 95

  allow_nonofficial_tree: false


runtime:
  # Physical GPU assignment. Each persistent worker sees only one GPU through
  # CUDA_VISIBLE_DEVICES, so its internal "cuda" means its assigned card.
  inpainting_gpu: 0
  simlingo_gpu: 1

  # At most this many completed inpainting routes can wait for SimLingo.
  # This bounds temporary disk usage while preserving GPU0/GPU1 overlap.
  pipeline_buffer_routes: 2

  resume_completed_routes: true
  rebuild_incomplete_routes: true

  # Formal batch logging: do not print every actor.
  progress_every: 50


debug:
  # Formal benchmark default. Turn on only for a small validation run.
  enabled: false
  every_n_actors: 20
  save_waypoint_comparison: false
  save_inpainting_diagnostic: false


output:
  save_counterfactual_images: false
  save_masks: false
  save_trajectories: false

  include_speed_wps_diagnostic: true

  strict_original_consistency: true
  original_consistency_atol: 1.0e-7
  original_consistency_rtol: 1.0e-7
